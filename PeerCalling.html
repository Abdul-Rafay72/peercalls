<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLink Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --danger: #ef4444;
            --info: #3b82f6;
            --text: #f8fafc;
            --muted: #64748b;
        }

        body {
            margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg); color: var(--text); overflow: hidden;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        .container { width: 100%; max-width: 950px; height: 100vh; display: flex; position: relative; background: var(--bg); }
        
        #login-panel { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; max-width: 420px; margin: 0 auto; padding: 40px; text-align: center; }
        #app-panel { display: none; width: 100%; height: 100%; }

        /* Multi-Pane App Frame Layout */
        .sidebar { width: 320px; background: #111827; border-right: 1px solid #334155; display: flex; flex-direction: column; height: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg); }

        .pane-header { background: var(--card); padding: 15px 20px; font-weight: bold; font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .list-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }

        /* Input Controls and Action Assets */
        input { width: 100%; padding: 14px; background: var(--card); border: 1px solid #334155; border-radius: 10px; color: white; margin-bottom: 12px; font-size: 15px; box-sizing: border-box; }
        button { padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s ease; }
        .primary-btn { width: 100%; background: var(--accent); color: white; margin-bottom: 10px; }
        .secondary-btn { width: 100%; background: transparent; color: var(--info); border: 1px solid var(--info); }
        .danger-btn { background: var(--danger); color: white; padding: 6px 12px; font-size: 12px; }

        .user-card { background: var(--card); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .call-btn { color: white; padding: 8px 16px; border-radius: 6px; font-size: 13px; }

        /* Call History Ledger Row Component */
        .history-card { background: #1e293b50; border-radius: 8px; padding: 12px; font-size: 13px; border-left: 4px solid var(--muted); display: flex; flex-direction: column; gap: 5px; }
        .history-card.CONNECTED { border-left-color: var(--accent); }
        .history-meta { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

        /* Signal Call State Window Overlays */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.98); z-index: 9999; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center;
        }
        
        .timer { font-size: 24px; font-family: monospace; color: var(--accent); z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .action-btns { display: flex; gap: 20px; z-index: 10; padding: 20px 0; }
        .round-btn { width: 70px; height: 70px; border-radius: 50%; font-size: 24px; display: flex; justify-content: center; align-items: center; }
        #status-bar { background: #334155; font-size: 11px; text-align: center; padding: 4px; color: #94a3b8; font-weight: bold; width: 100%; position: absolute; top: 0; left: 0; z-index: 10; }

        /* Dynamic Grid Layout for Group Video Feeds */
        .video-grid-canvas { 
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 120px); 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; padding: 20px; box-sizing: border-box; background: #000; overflow-y: auto;
        }
        .video-wrapper { position: relative; background: #111827; border-radius: 12px; overflow: hidden; border: 2px solid #334155; height: 100%; min-height: 200px; }
        .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
        .video-wrapper.local-feed video { transform: scaleX(-1); }
        .peer-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(15, 23, 42, 0.75); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div id="status-bar">CONNECTING...</div>

        <!-- Authentication View Window -->
        <div id="login-panel">
            <h1 style="font-size: 36px; margin: 0 0 5px 0; color: var(--info);">VoiceLink Pro</h1>
            <p style="color: #94a3b8; margin-bottom: 25px; font-size: 14px;">Real-Time Unified Communications Gateway</p>
            <input id="username" type="text" placeholder="Username" autocomplete="off">
            <input id="password" type="password" placeholder="Password">
            <button class="primary-btn" onclick="processAuth('LOGIN')">Log In</button>
            <button class="secondary-btn" onclick="processAuth('REGISTER')">Create Account</button>
        </div>

        <!-- Main Application Dashboard View Layout -->
        <div id="app-panel">
            <!-- Left Side: Interactive Historical Logs -->
            <div class="sidebar">
                <div class="pane-header">Call Log Ledger</div>
                <div id="history-box" class="list-container">
                    <div style="color: var(--muted); font-size:12px; text-align:center; padding-top:20px;">No historical entries</div>
                </div>
            </div>

            <!-- Right Side: Room Management & Directory -->
            <div class="main-content" style="padding-top: 23px;">
                <header style="background: var(--card); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
                    <div id="me-label" style="font-weight: bold; color: var(--info); font-size: 16px;">@---</div>
                    <button class="danger-btn" onclick="logout()">Logout</button>
                </header>
                
                <!-- Group Call Room Creation Toolbar -->
                <div style="background: var(--card); padding: 15px; border-bottom: 1px solid #334155; display: flex; gap: 10px;">
                    <input id="roomInput" type="text" placeholder="Enter Room ID (e.g., lounge)" style="margin-bottom: 0; flex: 1; padding: 10px;">
                    <button class="primary-btn" style="width: auto; margin-bottom: 0; padding: 10px 20px;" onclick="joinGroupRoom()">JOIN ROOM</button>
                </div>

                <div class="pane-header" style="background: transparent;">Available Online Users</div>
                <div id="users-box" class="list-container"></div>
            </div>
        </div>

        <!-- Unified Interactive WebRTC Media Grid Canvas Overlay -->
        <div id="activeCallOverlay" class="overlay" style="justify-content: flex-end; background: #0b0f19;">
            <!-- Target for runtime creation of video panes -->
            <div id="groupVideoGrid" class="video-grid-canvas"></div>
            
            <div id="callTimer" class="timer" style="position: absolute; top: 10px; right: 20px; margin: 0;">00:00</div>
            
            <div class="action-btns">
                <button id="muteBtn" class="round-btn" style="background:#475569;" onclick="toggleMute()">🎤</button>
                <button class="round-btn" style="background:var(--danger); width: 80px; height: 80px;" onclick="leaveGroupRoom()">🛑</button>
                <button id="videoToggleBtn" class="round-btn" style="background:#475569;" onclick="toggleVideoFeed()">📷</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xbvcdtvjeunbamobivpe.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhidmNkdHZqZXVuYmFtb2JpdnBlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MzE0NjgsImV4cCI6MjA4ODQwNzQ2OH0.epzWcz1TZzleu22POM2fpGTU6PbUeAqlWlkDBLtQVHM";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myUser = localStorage.getItem("voice_user_v3");
        let peer, localStream, timerInterval, realtimeChannel, heartbeatInterval, directoryPollInterval, groupRoomChannel;
        let seconds = 0, isMuted = false, isVideoStopped = false;
        let currentRoomId = null;
        
        // Tracks active peer connections within the mesh node matrix
        const activeGroupCalls = {}; 

        window.addEventListener('DOMContentLoaded', () => {
            if (myUser) {
                startApp();
            } else {
                updateStatus("LOGIN REQUIRED", "#64748b");
            }
        });

        window.addEventListener('beforeunload', () => {
            leaveGroupRoom();
            if (peer) peer.destroy();
        });

        async function processAuth(type) {
            const u = document.getElementById("username").value.trim().toLowerCase();
            const p = document.getElementById("password").value.trim();

            if (u.length < 3 || p.length < 4) return alert("Credentials too short (User: min 3, Pass: min 4 chars)");

            if (type === 'REGISTER') {
                const { data: exist } = await db.from("users").select("username").eq("username", u).maybeSingle();
                if (exist) return alert("Username already taken!");
                
                await db.from("users").insert({ username: u, password: p });
                alert("Registration complete! Access granted.");
            } else {
                const { data: profile } = await db.from("users").select("*").eq("username", u).maybeSingle();
                if (!profile || profile.password !== p) return alert("Invalid Username or Password combination.");
            }

            localStorage.setItem("voice_user_v3", u);
            myUser = u;
            startApp();
        }

        async function startApp() {
            document.getElementById("login-panel").style.display = "none";
            document.getElementById("app-panel").style.display = "flex";
            document.getElementById("me-label").innerText = "@" + myUser;
            updateStatus("SYNCHRONIZING PROFILE...", "#3b82f6");

            try {
                await db.from("online_users").upsert({ 
                    username: myUser, 
                    last_seen: new Date().toISOString() 
                });
                
                initPeerEngine();
                await loadOnlineDirectory();
                await loadCallHistoryTable();
                initRealtimeEngine();

                clearInterval(heartbeatInterval);
                heartbeatInterval = setInterval(() => {
                    if (myUser) {
                        db.from("online_users").upsert({ 
                            username: myUser, 
                            last_seen: new Date().toISOString(),
                            current_room: currentRoomId
                        });
                    }
                }, 2000);

                clearInterval(directoryPollInterval);
                directoryPollInterval = setInterval(() => {
                    loadOnlineDirectory();
                }, 4000);

            } catch (err) {
                console.error("Initialization failure:", err);
                updateStatus("DATABASE CONNECTION ERROR", "#ef4444");
            }
        }

        async function logout() {
            leaveGroupRoom();
            clearInterval(heartbeatInterval);
            clearInterval(directoryPollInterval);
            if (myUser) await db.from("online_users").delete().eq("username", myUser);
            if (peer) peer.destroy();
            localStorage.removeItem("voice_user_v3");
            location.reload();
        }

        function initRealtimeEngine() {
            if (realtimeChannel) realtimeChannel.unsubscribe();
            
            realtimeChannel = db.channel('instant-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'online_users' }, () => loadOnlineDirectory())
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'call_history' }, () => loadCallHistoryTable())
                .subscribe();
        }

        async function loadOnlineDirectory() {
            const cutoff = new Date(Date.now() - (8 * 1000)).toISOString();
            const { data, error } = await db.from("online_users").select("*").gte("last_seen", cutoff);
            
            if (error) return console.error("Directory sync exception:", error);

            const box = document.getElementById("users-box");
            const peers = data ? data.filter(u => u.username !== myUser) : [];
            const newSignature = peers.map(u => `${u.username}:${u.current_room || 'idle'}`).sort().join(",");
            const oldSignature = box.getAttribute("data-peers-signature") || "";

            if (newSignature === oldSignature && box.innerHTML !== "") return;
            box.setAttribute("data-peers-signature", newSignature);

            box.innerHTML = "";
            if (peers.length === 0) {
                box.innerHTML = `<div style="color:var(--muted); font-size:13px; text-align:center; padding-top:20px;">No other users are online</div>`;
                return;
            }

            peers.forEach(u => {
                const div = document.createElement("div");
                div.className = "user-card";
                
                if (u.current_room) {
                    const isPrivate = u.current_room.startsWith("priv-");
                    const labelText = isPrivate ? "In Private Call" : `In Room: ${u.current_room}`;
                    const btnText = isPrivate ? "Call Direct" : "Join Room";
                    const btnBg = isPrivate ? "var(--accent)" : "var(--info)";
                    const clickAction = isPrivate ? `startPrivateCall('${u.username}')` : `joinSpecificGroup('${u.current_room}')`;

                    div.innerHTML = `
                        <div>
                            <span style="color: var(--info);">🔵 @${u.username}</span>
                            <div style="color: var(--muted); font-size: 11px; margin-top: 2px;">${labelText}</div>
                        </div>
                        <button class="call-btn" style="background: ${btnBg};" onclick="${clickAction}">
                            ${btnText}
                        </button>
                    `;
                } else {
                    div.innerHTML = `
                        <div>
                            <span style="color: var(--accent);">🟢 @${u.username}</span>
                            <div style="color: var(--muted); font-size: 11px; margin-top: 2px;">Available to chat</div>
                        </div>
                        <button class="call-btn" style="background: var(--accent);" onclick="startPrivateCall('${u.username}')">
                            Call Direct
                        </button>
                    `;
                }
                box.appendChild(div);
            });
        }

        async function loadCallHistoryTable() {
            const { data } = await db.from("call_history")
                .select("*")
                .or(`caller_username.eq.${myUser},receiver_username.eq.${myUser}`)
                .order('created_at', { ascending: false })
                .limit(15);

            const box = document.getElementById("history-box");
            box.innerHTML = "";
            
            if(!data || data.length === 0) {
                box.innerHTML = `<div style="color:var(--muted); font-size:12px; text-align:center; padding-top:20px;">No entries</div>`;
                return;
            }

            data.forEach(item => {
                const isRoom = item.receiver_username.startsWith("room_");
                const isPrivate = item.receiver_username.startsWith("priv-");
                let targetLabel = `To: @${item.receiver_username}`;
                
                if (isRoom) targetLabel = `Group Room: ${item.receiver_username.replace("room_", "")}`;
                if (isPrivate) targetLabel = `1-on-1 Call System`;
                
                const div = document.createElement("div");
                div.className = `history-card CONNECTED`;
                div.innerHTML = `
                    <div style="font-weight:bold; display:flex; justify-content:space-between;">
                        <span>📞 ${targetLabel}</span>
                        <span style="font-size:11px; opacity:0.85;">SESSION</span>
                    </div>
                    <div class="history-meta">
                        <span>Duration: ${item.duration}</span>
                    </div>
                `;
                box.appendChild(div);
            });
        }

        function initPeerEngine() {
            if (peer) peer.destroy();
            
            peer = new Peer(myUser);
            peer.on("open", () => updateStatus("REALTIME SIGNAL ROUTER ACTIVE", "#10b981"));
            
            peer.on("call", call => {
                if (!currentRoomId || !localStream) {
                    call.answer();
                    call.close();
                    return;
                }
                
                call.answer(localStream);
                call.on("stream", remoteStream => attachVideoPane(call.peer, remoteStream));
                call.on("close", () => removeVideoPane(call.peer));
                activeGroupCalls[call.peer] = call;
            });
        }

        /* 1-on-1 Interaction Router */
        function startPrivateCall(targetUsername) {
            // Generates a deterministically sorted room identifier signature based on credentials
            const privateRoomId = "priv-" + [myUser, targetUsername].sort().join("-");
            joinSpecificGroup(privateRoomId);
        }

        function joinSpecificGroup(roomId) {
            document.getElementById('roomInput').value = roomId;
            joinGroupRoom();
        }

        /* Core Unified Broadcast Matrix Protocols */
        async function joinGroupRoom() {
            const rInput = document.getElementById("roomInput").value.trim().toLowerCase();
            if (!rInput) return alert("Please enter a valid configuration space designator.");

            currentRoomId = rInput;
            const statusLabel = currentRoomId.startsWith("priv-") ? "PRIVATE CHAT MATRIX" : `ROOM: ${currentRoomId.toUpperCase()}`;
            updateStatus(`CONNECTING TO ${statusLabel}...`, "#3b82f6");

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                document.getElementById("activeCallOverlay").style.display = "flex";
                
                attachVideoPane(myUser, localStream, true);
                runTimer();

                // Explicitly bind the online session row instance out into the global scope context
                await db.from("online_users").upsert({ username: myUser, last_seen: new Date().toISOString(), current_room: currentRoomId });

                groupRoomChannel = db.channel(`mesh_${currentRoomId}`);
                groupRoomChannel
                    .on('broadcast', { event: 'join-announcement' }, (payload) => {
                        if (payload.payload.username !== myUser && !activeGroupCalls[payload.payload.username]) {
                            dialMeshNode(payload.payload.username);
                        }
                    })
                    .on('broadcast', { event: 'heartbeat-ping' }, (payload) => {
                        if (payload.payload.username !== myUser && !activeGroupCalls[payload.payload.username]) {
                            dialMeshNode(payload.payload.username);
                        }
                    })
                    .subscribe(async (status) => {
                        if (status === 'SUBSCRIBED') {
                            await groupRoomChannel.send({
                                type: 'broadcast',
                                event: 'join-announcement',
                                payload: { username: myUser }
                            });
                        }
                    });

                activeGroupCalls["_pingInterval"] = setInterval(() => {
                    groupRoomChannel.send({
                        type: 'broadcast',
                        event: 'heartbeat-ping',
                        payload: { username: myUser }
                    });
                }, 3000);

                updateStatus(`CONNECTED TO ${statusLabel}`, "#10b981");

            } catch (e) {
                console.error(e);
                alert("Failed to secure active multimedia tracking hardware context pipelines.");
                leaveGroupRoom();
            }
        }

        function dialMeshNode(targetPeerId) {
            if (!localStream || !peer) return;
            
            const call = peer.call(targetPeerId, localStream);
            activeGroupCalls[targetPeerId] = call;

            call.on("stream", remoteStream => attachVideoPane(targetPeerId, remoteStream));
            call.on("close", () => removeVideoPane(targetPeerId));
            call.on("error", () => removeVideoPane(targetPeerId));
        }

        function attachVideoPane(peerId, stream, isLocal = false) {
            if (document.getElementById(`vid-wrapper-${peerId}`)) return;

            const grid = document.getElementById("groupVideoGrid");
            const wrapper = document.createElement("div");
            wrapper.id = `vid-wrapper-${peerId}`;
            wrapper.className = `video-wrapper ${isLocal ? 'local-feed' : ''}`;

            const video = document.createElement("video");
            video.srcObject = stream;
            video.autoplay = true;
            video.playsInline = true;
            if (isLocal) video.muted = true; 

            const label = document.createElement("div");
            label.className = "peer-tag";
            label.innerText = isLocal ? `@${peerId} (You)` : `@${peerId}`;

            wrapper.appendChild(video);
            wrapper.appendChild(label);
            grid.appendChild(wrapper);
        }

        function removeVideoPane(peerId) {
            const pane = document.getElementById(`vid-wrapper-${peerId}`);
            if (pane) pane.remove();
            if (activeGroupCalls[peerId]) delete activeGroupCalls[peerId];
        }

        async function leaveGroupRoom() {
            clearInterval(timerInterval);
            if (activeGroupCalls["_pingInterval"]) clearInterval(activeGroupCalls["_pingInterval"]);

            if (currentRoomId && seconds > 0) {
                const elapsed = document.getElementById("callTimer").innerText;
                const dbRoomName = currentRoomId.startsWith("priv-") ? currentRoomId : `room_${currentRoomId}`;
                await db.from("call_history").insert({
                    caller_username: myUser,
                    receiver_username: dbRoomName,
                    status: 'CONNECTED',
                    duration: elapsed
                });
            }

            if (myUser) {
                await db.from("online_users").upsert({ username: myUser, last_seen: new Date().toISOString(), current_room: null });
            }

            if (groupRoomChannel) groupRoomChannel.unsubscribe();
            
            Object.keys(activeGroupCalls).forEach(peerId => {
                if (peerId !== "_pingInterval" && activeGroupCalls[peerId].close) {
                    activeGroupCalls[peerId].close();
                }
            });

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById("groupVideoGrid").innerHTML = "";
            document.getElementById("activeCallOverlay").style.display = "none";
            document.getElementById("roomInput").value = "";
            
            currentRoomId = null;
            seconds = 0;
            isMuted = false;
            isVideoStopped = false;

            document.getElementById("muteBtn").innerText = "🎤";
            document.getElementById("muteBtn").style.background = "#475569";
            document.getElementById("muteBtn").style.color = "white";
            document.getElementById("videoToggleBtn").innerText = "📷";
            document.getElementById("videoToggleBtn").style.background = "#475569";
            document.getElementById("videoToggleBtn").style.color = "white";

            updateStatus("READY", "#94a3b8");
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            localStream.getAudioTracks()[0].enabled = !isMuted;
            const btn = document.getElementById("muteBtn");
            btn.innerText = isMuted ? "🔇" : "🎤";
            btn.style.background = isMuted ? "white" : "#475569";
            btn.style.color = isMuted ? "black" : "white";
        }

        function toggleVideoFeed() {
            if (!localStream) return;
            isVideoStopped = !isVideoStopped;
            localStream.getVideoTracks()[0].enabled = !isVideoStopped;
            const btn = document.getElementById("videoToggleBtn");
            btn.innerText = isVideoStopped ? "❌📹" : "📷";
            btn.style.background = isVideoStopped ? "white" : "#475569";
            btn.style.color = isVideoStopped ? "black" : "white";
        }

        function runTimer() {
            clearInterval(timerInterval); seconds = 0;
            document.getElementById("callTimer").innerText = "00:00";
            timerInterval = setInterval(() => {
                seconds++;
                const m = Math.floor(seconds/60).toString().padStart(2,'0');
                const s = (seconds%60).toString().padStart(2,'0');
                document.getElementById("callTimer").innerText = m + ":" + s;
            }, 1000);
        }

        function updateStatus(txt, col) {
            const s = document.getElementById("status-bar");
            s.innerText = txt; s.style.color = col;
        }
    </script>
</body>
</html>
